[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-assistant"
version = "3.0.0"
description = "LLM-powered review of git diffs: bugs, security, performance and style, with CI/PR integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diksha Shahi" }]
dependencies = ["groq>=0.11", "pydantic>=2.5"]

[project.optional-dependencies]
server = ["flask>=3.0", "gunicorn>=22.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "flask>=3.0"]

[project.scripts]
ai-review = "ai_reviewer.cli:main"

[tool.setuptools]
packages = ["ai_reviewer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
